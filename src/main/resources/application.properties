# APPLICATION
spring.application.name=hrm-backend
server.port=8085
# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/hrm_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# JWT
jwt.secret=Enter JWT Secreate Key 
jwt.expiration=86400000
# EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=Enter The App Mail
spring.mail.password=Eneter the app password for SMTP server 

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# MULTIPART / FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
